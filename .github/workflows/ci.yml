# CI: repo suite + tournament fake run + planted-bug variants.
#
# Runs on push and on pull_request. NEVER pull_request_target: that runs
# with write permissions and access to secrets, and this repo intentionally
# executes attacker-controlled code paths (the tournament). pull_request
# runs with read-only permissions, which is all CI needs.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repo suite (22 chaos tests + demo)
        run: python3 run.py
      - name: Tournament, clean layer (must hold: 0 breaks)
        run: python3 run_tournament.py --rounds 6 --expect-clean
      - name: Tournament, planted-bug variants (all 7 must be caught)
        run: python3 run_tournament.py --rounds 6 --variants all --expect-breaks
      - name: Trust-layer tests
        run: python3 -m unittest tests.test_trust_layer -v
      - name: Trust-layer suite (scripted, must reproduce exactly)
        run: |
          python3 run_trust_layer.py --seeds 5 --out /tmp/tl_a
          python3 run_trust_layer.py --seeds 5 --out /tmp/tl_b
          cmp /tmp/tl_a/results.json /tmp/tl_b/results.json
